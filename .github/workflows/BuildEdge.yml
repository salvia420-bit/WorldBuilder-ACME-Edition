name: Build Edge
on:
  push:
    branches:
      - master
      - main
      - '**'  # Run on all branches
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build-and-release-edge:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for GitVersion and changelog

    - name: Install Dependencies
      run: |
        sudo sed -i 's/yes/no/g' /etc/initramfs-tools/update-initramfs.conf # Disable initramfs update
        sudo rm -f /var/lib/man-db/auto-update # Disable man-db update
        sudo apt update && sudo apt install -y nsis nsis-pluginapi
        dotnet tool install --global NetSparkleUpdater.Tools.AppCastGenerator
    
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.10.2
      with:
        versionSpec: '6.4.x'
    
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0.10.2
      with:
        useConfigFile: true

    - name: Set version envs
      run: |
        echo "ASSEMBLY_VERSION=${{ steps.gitversion.outputs.major }}.0.0" >> $GITHUB_ENV
        echo "APP_VERSION=${{ steps.gitversion.outputs.majorMinorPatch }}+${{ steps.gitversion.outputs.commitsSinceVersionSource }}" >> $GITHUB_ENV

    - name: Build
      # -p:DebugType=none is a SHIPPING requirement, not a size tweak.
      #
      # Two separate leaks come out of debug symbols here:
      #   1. Installer.nsi packs `File "${BUILDPATH}\*.*"`, unfiltered, so every
      #      .pdb in the publish directory was installed onto the user's disk.
      #      A portable PDB carries the full source-document path table.
      #   2. Directory.Build.props sets PathMap so assemblies embed /_/ instead
      #      of a real path, and that works for every project EXCEPT the two
      #      Avalonia ones: Avalonia's XAML compiler rewrites WorldBuilder.dll
      #      and WorldBuilder.Windows.dll after Roslyn and regenerates their
      #      RSDS debug directory from the real on-disk .pdb path, undoing the
      #      mapping. DebugType=none removes that record entirely.
      #
      # Cost: no line numbers in release stack traces. Verified: with this flag
      # the leak gate below passes over the whole publish directory.
      run: dotnet publish WorldBuilder.Windows/WorldBuilder.Windows.csproj -r win-x64 -p:DebugType=none -p:InformationalVersion=${{ env.APP_VERSION }} -p:Version=${{ env.APP_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}
    
    # ---------------------------------------------------------------------
    # Internal-leak gate. Runs on the PUBLISH OUTPUT, between `dotnet publish`
    # and `makensis`, because that directory is exactly what Installer.nsi packs
    # (`File "${BUILDPATH}\*.*"` — the whole dir, unfiltered) and therefore
    # exactly what a user ends up with on disk.
    #
    # It is FATAL on purpose. WorldBuilder.Shared.dll shipped a developer's data
    # mount as UTF-16LE `const string` literals, and WorldBuilder.dll carried the
    # build machine's home directory in its RSDS debug directory; neither is
    # visible to an ASCII `grep`, and nothing in this pipeline looked. The
    # scanner reads raw bytes in both encodings. See tools/leak_scan.py.
    #
    # It runs BEFORE the release-mutating steps below (which delete and re-create
    # the `latest` release), so a leak fails the job without disturbing whatever
    # is already published.
    - name: Internal-leak gate (publish output)
      run: |
        python3 tools/leak_scan.py \
          --label "WorldBuilder.Windows win-x64 publish output" \
          "${{ github.workspace }}/WorldBuilder.Windows/bin/Release/net8.0/win-x64/publish/"

    - name: Get Latest Release Tag
      id: get_latest_release
      run: |
        latest_tag=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
        echo "LATEST_TAG=$latest_tag" >> $GITHUB_OUTPUT
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Delete existing 'latest' release
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      run: |
        gh release delete latest --yes || true
        git push origin :refs/tags/latest || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate Changelog
      id: changelog
      run: |
        gh api \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          /repos/${{ github.repository }}/releases/generate-notes \
          -f tag_name='latest' \
          -f target_commitish='${{ github.ref_name }}' \
          -f previous_tag_name='${{ steps.get_latest_release.outputs.LATEST_TAG }}' \
          > changelog.json
        
        # Extract the body from the response
        CHANGELOG_BODY=$(jq -r '.body' changelog.json)
        
        # Save to file and output
        echo "$CHANGELOG_BODY" > "${{ env.APP_VERSION }}.md"
        
        # Set output using multiline syntax
        {
          echo 'changelog<<EOF'
          echo "$CHANGELOG_BODY"
          echo 'EOF'
        } >> $GITHUB_OUTPUT
        
        # Print changelog
        echo "Changelog:"
        cat "${{ env.APP_VERSION }}.md"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # The script lives at installer/Installer.nsi — it was moved there in
    # 10da18f1 and this line was never updated, so every `Build Edge` run since
    # has died here. OUTDIR is passed explicitly because makensis chdirs to the
    # script's directory, which would otherwise drop the .exe in installer/
    # while the steps below look for it at the workspace root.
    - name: Build installer
      run: |
          makensis -DVERSION="${{ env.APP_VERSION }}" -DOUTDIR="${{ github.workspace }}" -DBUILDPATH="${{ github.workspace }}/WorldBuilder.Windows/bin/Release/net8.0/win-x64/publish/" "${{ github.workspace }}/installer/Installer.nsi"
    
    - name: Generate updated appcast
      run: |
        mkdir -p appcast
        cp ./ACME-WorldBuilderInstall-${{ env.APP_VERSION }}.exe appcast/
        cd appcast
        curl -f -o appcast.xml https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/appcast.xml || true
        
        # Remove all edge channel releases from existing appcast
        if [ -f appcast.xml ]; then
          python3 ${{ github.workspace }}/.github/scripts/clean_appcast.py appcast.xml edge
        fi
        
        netsparkle-generate-appcast -b . -f true --os windows-x64 -n WorldBuilder --file-version "${{ env.APP_VERSION }}" --overwrite-old-items --reparse-existing true --human-readable true --channel edge --change-log-path ../ --base-url "https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/releases/download/latest/"
        echo "Updated appcast.xml:"
        cat appcast.xml
        rm ACME-WorldBuilderInstall-${{ env.APP_VERSION }}.exe
      shell: bash
      env:
        SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
    
    - name: Create/Update Pre-release
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: "Edge"
        body: |
          ## 🚀 Edge Build ${{ env.APP_VERSION }}
          
          This is an automated pre-release build from the latest commit.
          
          ### 📋 Changelog
          ${{ steps.changelog.outputs.changelog }}
          
          ### ⚠️ Warning
          This is a preview build and may contain bugs or incomplete features.
        files: ./ACME-WorldBuilderInstall-${{ env.APP_VERSION }}.exe
        prerelease: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Deploy appcast to GitHub Pages
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./appcast
        keep_files: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'