<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WorldBuilder · DerethMaps Enhanced</title>
  <link rel="stylesheet" href="leaflet/leaflet.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header id="header">
    <div class="brand">DerethMaps Enhanced</div>
    <label class="project-picker">
      Project
      <select id="project-select"></select>
    </label>
    <div id="floor-selector"></div>
    <div id="status-line">loading…</div>
    <!-- Optional sibling Tailwind gallery emitted by `emit-static-site --gallery`.
         The link is hidden by default; app.js probes for gallery/index.html on
         boot and unhides it when present so Leaflet-only emits don't show a
         dead link. -->
    <a id="gallery-link" href="gallery/index.html" hidden>Gallery view ↗</a>
  </header>
  <div id="boot-banner" hidden></div>
  <main>
    <div id="map"></div>
    <aside id="describe-panel">
      <button id="panel-toggle" type="button" title="Hide / show panel"
              onclick="var p=document.getElementById('describe-panel');p.classList.toggle('collapsed');this.textContent=p.classList.contains('collapsed')?'‹':'›';">›</button>
      <div class="panel-empty">Hover over a landblock to see its description.</div>
    </aside>
  </main>
  <script src="leaflet/leaflet.js"></script>
  <script src="manifest.js"></script>
  <script src="app.js"></script>
</body>
</html>
