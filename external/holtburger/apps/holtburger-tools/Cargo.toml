[package]
name = "holtburger-tools"
version = "0.1.0"
edition = "2024"
authors = ["holtburger contributors"]
default-run = "dat2hba"

[dependencies]
holtburger-common = { workspace = true }
holtburger-content = { path = "../../crates/holtburger-content" }
holtburger-dat = { path = "../../crates/holtburger-dat" }
holtburger-event-bake = { workspace = true }
holtburger-manifest = { workspace = true }
holtburger-scenery-bake = { workspace = true }
# ORACLE (pcap2jsonl): the retail-parity oracle decodes captured AC UDP
# traffic. `holtburger-protocol` is a pure parsing crate (no networking), and
# `holtburger-session` is needed only for its `optional_header` module — the
# canonical optional-header ordering that says where fragments start.
holtburger-protocol = { workspace = true }
holtburger-session = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }
binrw = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
indicatif = { workspace = true } # Progress bars for the win
rayon = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
# T10 pack bake: HBP1 per-section compression (native-only tool crate, so
# the C-backed workspace `zstd` is fine — same choice holtburger-dat makes).
zstd = { workspace = true }
reqwest.workspace = true
zip.workspace = true
regex.workspace = true
# PAGE-RESAMPLE: derived page-dim corpus tier (`page-resample` bin).
png = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
