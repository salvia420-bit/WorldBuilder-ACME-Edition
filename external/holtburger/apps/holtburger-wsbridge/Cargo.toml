[package]
name = "holtburger-wsbridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WebSocket↔UDP bridge for browser-hosted holtburger clients (Phase 1 of emit-dynamic-site)."

[[bin]]
name = "holtburger-wsbridge"
path = "src/main.rs"

[[bin]]
name = "holtburger-wsshim"
path = "src/bin/wsshim.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
clap = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# net-3 (R2-net 2026-10-08): raise the ACE-facing UDP socket's SO_RCVBUF
# (same 2 MiB as holtburger-session's native `Session::new`).
socket2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
# net-transport-2: `disconnect.rs` restates Hash32 and the packet header
# layout; its tests cross-check them against the client's own protocol code
# (`PacketHeader::calculate_checksum`, `Hash32::compute`). Test-only, so the
# bridge binary still never links the protocol crate.
holtburger-protocol = { workspace = true }
