<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>cloud_load_smoke — Clouds-A foundation gate</title>
    <style>
      body { font-family: ui-monospace, monospace; margin: 2rem; line-height: 1.4; }
      h1 { font-size: 1.1rem; }
      #status { padding: 0.5rem 0.75rem; border-radius: 4px; font-weight: bold; }
      #status.pending { background: #f4f4f4; color: #888; }
      #status.ok      { background: #e7f5e7; color: #1a7f1a; }
      #status.fail    { background: #fae8e8; color: #b30000; }
      pre { background: #f7f7f7; padding: 0.5rem; border-radius: 4px; overflow-x: auto; font-size: 0.85rem; }
    </style>

    <!-- Importmap MUST match index.html's importmap entries 1:1. See
         docs/skybox-volumetric-clouds-handoff-2026-05-15.md (Clouds-A
         scope). When adding a new entry to index.html, mirror it here. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "@takram/three-clouds": "https://cdn.jsdelivr.net/npm/@takram/three-clouds@0.7.6/build/index.js",
          "@takram/three-atmosphere": "https://cdn.jsdelivr.net/npm/@takram/three-atmosphere@0.19.1/build/index.js",
          "@takram/three-atmosphere/shaders/bruneton": "https://cdn.jsdelivr.net/npm/@takram/three-atmosphere@0.19.1/build/shaders/bruneton.js",
          "@takram/three-geospatial": "https://cdn.jsdelivr.net/npm/@takram/three-geospatial@0.9.1/build/index.js",
          "@takram/three-geospatial/shaders": "https://cdn.jsdelivr.net/npm/@takram/three-geospatial@0.9.1/build/shaders.js",
          "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.1/build/index.js",
          "tiny-invariant": "https://cdn.jsdelivr.net/npm/tiny-invariant@1.3.3/dist/esm/tiny-invariant.js"
        }
      }
    </script>
  </head>
  <body>
    <h1>Clouds-A foundation — module load smoke</h1>
    <p>
      Loads <code>@takram/three-clouds</code> + transitive peer deps
      through the importmap. Success means every CDN URL resolves and
      every ESM <code>import</code> binds without throwing. No
      rendering is attempted here — that's Clouds-B+.
    </p>

    <div id="status" class="pending">pending</div>
    <pre id="details">starting…</pre>

    <script type="module">
      const statusEl  = document.getElementById('status');
      const detailsEl = document.getElementById('details');

      function setStatus(cls, msg) {
        statusEl.className = cls;
        statusEl.textContent = msg;
      }
      function appendDetail(line) {
        detailsEl.textContent += '\n' + line;
      }

      window.__cloudLoadSmoke = { ok: false, error: null, names: [] };

      try {
        appendDetail('importing three…');
        const THREE = await import('three');
        appendDetail('  three: ' + (THREE.REVISION ?? '(no revision)'));

        appendDetail('importing postprocessing…');
        const PP = await import('postprocessing');
        appendDetail('  postprocessing: ' + Object.keys(PP).length + ' exports');

        appendDetail('importing @takram/three-clouds…');
        const Clouds = await import('@takram/three-clouds');
        const names = Object.keys(Clouds).sort();
        appendDetail('  @takram/three-clouds: ' + names.length + ' exports');
        appendDetail('  named: ' + names.join(', '));

        // Spot-check exports that are load-bearing for Clouds-B-D.
        // The full `index.ts` re-exports much more (CloudShape,
        // LocalWeather, Turbulence, ProceduralTexture …) but those
        // come along with CloudsEffect via the same module.
        const required = [
          'CloudsEffect',
          'CloudLayer',
          'CloudLayers',
        ];
        const missing = required.filter(n => !(n in Clouds));
        if (missing.length > 0) {
          throw new Error('missing required exports: ' + missing.join(', '));
        }

        window.__cloudLoadSmoke = {
          ok: true,
          error: null,
          names,
          threeRevision: THREE.REVISION,
          postprocessingExportCount: Object.keys(PP).length,
        };
        setStatus('ok', 'OK — Clouds-A foundation loads cleanly');
        appendDetail('OK');
      } catch (err) {
        window.__cloudLoadSmoke = { ok: false, error: String(err), names: [] };
        setStatus('fail', 'FAIL — ' + err.message);
        appendDetail('FAIL: ' + (err.stack ?? err));
      }
    </script>
  </body>
</html>
