<!doctype html><html><body><canvas id="c" width="96" height="96"></canvas>
<script type="importmap">{ "imports": { "three": "/three/three.module.js" } }</script>
<script type="module">
import * as THREE from "three";
import { installBatchedRunsChunks, installBatchedRuns, markBatchedRuns, getBatchedRunsStats } from "/app/scene3d/batched_runs.js";
const out = { errors: [] };
const origErr = console.error; console.error = (...a) => { out.errors.push(a.map(String).join(" ").slice(0, 400)); origErr(...a); };
// ?batchedRuns=off on this page's URL is the stock arm (the module reads location.search).
out.chunks = installBatchedRunsChunks(THREE);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c") });
renderer.debug.checkShaderErrors = true;
out.wrapper = installBatchedRuns(renderer);
out.multiDraw = renderer.extensions.has("WEBGL_multi_draw");
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(50, 1, 0.1, 100); cam.position.set(0, 0, 14);
cam.lookAt(0, 0, 0);
// Two buckets, same shapes: `runs` opts in (instanced runs), `stock` does not
// (three's layout through the PATCHED chunk — the head is never the marker).
function bucket(x0, mark) {
  const bm = new THREE.BatchedMesh(64, 4096, 8192, new THREE.MeshBasicMaterial());
  const gBox = bm.addGeometry(new THREE.BoxGeometry(0.8, 0.8, 0.8));
  const gBall = bm.addGeometry(new THREE.SphereGeometry(0.45, 12, 8));
  const m = new THREE.Matrix4(), c = new THREE.Color();
  let k = 0;
  for (let y = -2; y <= 2; y++) {
    for (let x = 0; x < 4; x++) {
      const id = bm.addInstance((x + y) % 3 === 0 ? gBall : gBox);
      bm.setMatrixAt(id, m.makeRotationZ(0.3 * k).setPosition(x0 + x * 1.3, y * 1.3, 0));
      bm.setColorAt(id, c.setHSL((k * 0.13) % 1, 0.8, 0.5));
      k++;
    }
  }
  bm.sortObjects = false;
  bm.perObjectFrustumCulled = true;
  if (mark) markBatchedRuns(bm);
  scene.add(bm);
  return bm;
}
bucket(-5.6, true);
bucket(0.4, false);
const t0 = performance.now();
renderer.render(scene, cam);
renderer.render(scene, cam); // second frame: the cached layout path
out.renderMs = Math.round(performance.now() - t0);
const gl = renderer.getContext();
out.glError = gl.getError();
out.programs = renderer.info.programs.map((p) => ({ name: p.name, linked: gl.getProgramParameter(p.program, gl.LINK_STATUS) }));
const all = new Uint8Array(96 * 96 * 4); gl.readPixels(0, 0, 96, 96, gl.RGBA, gl.UNSIGNED_BYTE, all);
out.frame = Array.from(all);
let lit = 0; for (let i = 0; i < all.length; i += 4) if (all[i] + all[i + 1] + all[i + 2] > 30) lit++;
out.litPixels = lit;
out.stats = getBatchedRunsStats();
out.renderer = gl.getParameter(gl.getExtension("WEBGL_debug_renderer_info")?.UNMASKED_RENDERER_WEBGL ?? gl.RENDERER);
window.__smoke = out;
</script></body></html>
