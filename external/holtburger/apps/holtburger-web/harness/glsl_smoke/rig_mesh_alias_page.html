<!doctype html><html><body><canvas id="c" width="128" height="128"></canvas>
<script type="importmap">{ "imports": { "three": "/three/three.module.js" } }</script>
<script type="module">
// ?rigMeshAlias pixel smoke page (driven by rig_mesh_alias_smoke.mjs): entity-
// shaped rigs (root → part Groups → surface meshes, lit, under a -π/2 world
// root like scene3d/index.js), animated over 12 frames with the alias-relevant
// events — pose changes, a hidden surface, a hidden part, an offset surface,
// a dislocation (quaternion + position writes) and its heal, a surface moved
// to another part, a held item (nested rig) under a part. Three frames are
// read back; the flag-off and flag-on pages must match pixel for pixel.
import * as THREE from "three";
import { installSkipHiddenMatrix } from "/app/scene3d/skip_hidden_matrix.js";
import { installRigMeshAlias, rigMeshAliasStats, rigMeshAliased, rigMeshAliasEnabled } from "/app/scene3d/setup_rig.js";
const out = { errors: [] };
const origErr = console.error; console.error = (...a) => { out.errors.push(a.map(String).join(" ").slice(0, 400)); origErr(...a); };
installSkipHiddenMatrix(THREE); // production default (?skipHiddenMatrix)
out.flag = rigMeshAliasEnabled();
const W = 128, H = 128;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: false });
renderer.debug.checkShaderErrors = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101418);
const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
cam.position.set(0, 7, 10);
cam.lookAt(0, 0.8, 0);
scene.add(new THREE.AmbientLight(0x606060));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(3, 8, 5);
scene.add(sun);
const world = new THREE.Group();
world.rotation.x = -Math.PI / 2; // AC Z-up → three Y-up
scene.add(world);
const group = new THREE.Group();
world.add(group);
// deterministic
let seed = 0x1234567;
const r = () => { seed = (seed + 0x6d2b79f5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const geoms = [new THREE.BoxGeometry(0.32, 0.22, 0.5), new THREE.SphereGeometry(0.18, 12, 8), new THREE.CylinderGeometry(0.08, 0.1, 0.45, 10)];
const mats = [0xd04040, 0x40c060, 0x4070e0, 0xd0b030, 0xb050c0, 0x40c0c0].map((c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.6, metalness: 0.1 }));
const rigs = [];
const mkPart = (root, k, p) => {
  const g = new THREE.Group();
  g.name = `part_${p}`;
  root.add(g);
  installRigMeshAlias(THREE, g); // no-op with the flag off
  return g;
};
for (let k = 0; k < 6; k += 1) {
  const root = new THREE.Group();
  root.position.set((k % 3) * 3 - 3, Math.floor(k / 3) * 3 - 1.5, 0);
  group.add(root);
  const parts = [];
  for (let p = 0; p < 9; p += 1) {
    const g = mkPart(root, k, p);
    parts.push(g);
    for (let m = 0; m < 2; m += 1) {
      const mesh = new THREE.Mesh(geoms[(p + m) % 3], mats[(k + p + m) % mats.length]);
      if (p === 2 && m === 1) mesh.position.set(0.06, 0, 0.05); // an offset surface (three's path)
      if (p === 5 && m === 0) mesh.visible = false; // a never-drawn surface
      g.add(mesh);
    }
  }
  // a held item: nested rig root under part 4
  const held = new THREE.Group();
  held.position.set(0.1, 0, 0.2);
  const hp = mkPart(held, k, 99);
  hp.add(new THREE.Mesh(geoms[2], mats[(k + 3) % mats.length]));
  parts[4].add(held);
  rigs.push({ root, parts, held });
}
function pose(f) {
  for (let k = 0; k < rigs.length; k += 1) {
    const { root, parts } = rigs[k];
    root.quaternion.setFromAxisAngle(new THREE.Vector3(0, 0, 1), 0.25 * f + k);
    for (let p = 0; p < parts.length; p += 1) {
      const a = 0.4 * Math.sin(0.7 * f + p + k);
      parts[p].position.set(0.35 * Math.cos(p * 0.9), 0.35 * Math.sin(p * 0.9), 0.25 + 0.16 * p);
      parts[p].quaternion.setFromAxisAngle(new THREE.Vector3(Math.cos(p), Math.sin(p), 0.5).normalize(), a);
    }
  }
}
const frames = [];
const all = new Uint8Array(W * H * 4);
const gl = renderer.getContext();
const t0 = performance.now();
for (let f = 0; f < 12; f += 1) {
  pose(f);
  if (f === 3) rigs[1].parts[6].visible = false; // a degraded part
  if (f === 6) rigs[1].parts[6].visible = true;
  if (f === 4) for (const c of rigs[2].parts[3].children) { c.quaternion.set(0.2, 0, 0, 0.98); c.position.set(0.03, 0.02, 0); } // dislocation
  if (f === 7) for (const c of rigs[2].parts[3].children) { c.quaternion.set(0, 0, 0, 1); c.position.set(0, 0, 0); } // healed
  if (f === 5) rigs[3].parts[7].add(rigs[3].parts[1].children[0]); // a surface moved to another part
  if (f === 8) rigs[4].parts[0].children[1].visible = false;
  renderer.render(scene, cam);
  if (f === 3 || f === 7 || f === 11) {
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, all);
    frames.push(Array.from(all));
  }
}
out.renderMs = Math.round(performance.now() - t0);
out.glError = gl.getError();
out.programs = renderer.info.programs.map((p) => ({ name: p.name, linked: gl.getProgramParameter(p.program, gl.LINK_STATUS) }));
out.frame = [].concat(...frames);
let lit = 0;
for (let i = 0; i < out.frame.length; i += 4) if (out.frame[i] + out.frame[i + 1] + out.frame[i + 2] > 90) lit++;
out.litPixels = lit;
out.stats = rigMeshAliasStats();
let aliasedNow = 0;
scene.traverse((o) => { if (o.isMesh && rigMeshAliased(o)) aliasedNow += 1; });
out.aliasedNow = aliasedNow;
out.renderer = gl.getParameter(gl.getExtension("WEBGL_debug_renderer_info")?.UNMASKED_RENDERER_WEBGL ?? gl.RENDERER);
window.__smoke = out;
</script></body></html>
