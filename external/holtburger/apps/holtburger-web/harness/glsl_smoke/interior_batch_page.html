<!doctype html><html><body><canvas id="c" width="256" height="256"></canvas>
<script type="importmap">{ "imports": {
  "three": "/three/three.module.js",
  "three/addons/": "/three-addons/",
  "postprocessing": "/pp/index.js"
} }</script>
<script type="module">
// interior_batch_smoke.mjs page (R3-5 `?interiorBatch`). `?arm=town|punch|dungeon|sealed|shadow|shadowmap|layers`,
// loaded with and without `&interiorBatch=on` (cells.js reads the flag at module load); `&pools=1` arms the
// env-cell draw pools first, as scene3d/index.js does (interior_batch_lib.mjs POOL_ARMS); `&pom=1` builds the
// world on the POM material cache (interior_batch_lib.mjs POM_ARMS; `?arm=pom` is the close indoor frame);
// `&maps=1` on the texchan + luminous material cache (AO / roughness / emissive members; interior_batch_lib.mjs MAP_ARMS).
// The app's own rAF loops must not run on wall time: the arm steps frames itself.
window.requestAnimationFrame = () => 1;
window.cancelAnimationFrame = () => {};
const out = { errors: [] };
const origErr = console.error;
console.error = (...a) => { out.errors.push(a.map(String).join(" ").slice(0, 400)); origErr(...a); };
try {
  const THREE = await import("three");
  const LIB = await import("/app/harness/glsl_smoke/interior_batch_lib.mjs");
  const mods = {
    M: await import("/app/scene3d/materials.js"),
    adapter: await import("/app/scene3d/adapter.js"),
    cells: await import("/app/scene3d/cells.js"),
    IB: await import("/app/scene3d/gpu_batch/interior_batch.js"),
    KIT: await import("/app/scene3d/gpu_batch/kit.js"),
    PP: await import("/app/scene3d/portal_punch.js"),
  };
  const b64 = (u8) => { let t = ""; for (let i = 0; i < u8.length; i += 0x8000) t += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(t); };
  const arm = new URLSearchParams(location.search).get("arm") || "town";
  const pools = new URLSearchParams(location.search).get("pools") === "1";
  const pom = new URLSearchParams(location.search).get("pom") === "1";
  const maps = new URLSearchParams(location.search).get("maps") === "1";
  out.arm = arm;
  out.poolsArmed = pools;
  out.pom = pom;
  out.maps = maps;
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: false, logarithmicDepthBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(LIB.CANVAS, LIB.CANVAS, false);
  renderer.debug.checkShaderErrors = true;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  const gl = renderer.getContext();
  const dbg = gl.getExtension("WEBGL_debug_renderer_info");
  out.renderer = gl.getParameter(dbg ? dbg.UNMASKED_RENDERER_WEBGL : gl.RENDERER);
  const pause = () => new Promise((res) => setTimeout(res, 30));
  const r = await LIB.runArm(THREE, renderer, mods, arm, { ticks: 16, maxTicks: 400, pause, pools, maps, pom });
  out.calls = r.calls;
  out.lit = r.lit;
  out.ticks = r.ticks;
  out.settled = r.settled;
  out.frame = Array.from(r.frame);
  out.worldFrame = r.worldFrame ? Array.from(r.worldFrame) : null;
  out.punched = r.punched ?? null;
  out.doorway = r.doorway || null;
  out.doorwayMeshes = r.doorwayMeshes || null;
  out.shadowDepth = r.shadowDepth ? b64(new Uint8Array(r.shadowDepth.buffer)) : null;
  out.batch = r.batch;
  out.bits = r.bits;
  out.coverage = r.coverage;
  out.visible = r.visible;
  out.pools = r.pools || null;
  out.layers = r.layers || null;
  out.glError = gl.getError();
  out.programs = renderer.info.programs.map((p) => ({
    name: p.name, key: String(p.cacheKey || "").slice(0, 120), linked: gl.getProgramParameter(p.program, gl.LINK_STATUS),
  }));
} catch (e) {
  out.errors.push("THROW " + String((e && e.stack) || e).slice(0, 1200));
}
window.__smoke = out;
</script></body></html>
