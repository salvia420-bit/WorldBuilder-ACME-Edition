<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>atmosphere_bake_smoke — Sky-K.1 foundation gate</title>
    <style>
      body { font-family: ui-monospace, monospace; margin: 2rem; line-height: 1.4; }
      h1 { font-size: 1.1rem; }
      #status { padding: 0.5rem 0.75rem; border-radius: 4px; font-weight: bold; }
      #status.pending { background: #f4f4f4; color: #888; }
      #status.ok      { background: #e7f5e7; color: #1a7f1a; }
      #status.fail    { background: #fae8e8; color: #b30000; }
      pre { background: #f7f7f7; padding: 0.5rem; border-radius: 4px; overflow-x: auto; font-size: 0.85rem; }
      canvas { display: none; }
    </style>

    <!-- Mirrors index.html's importmap 1:1. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "@takram/three-atmosphere": "https://cdn.jsdelivr.net/npm/@takram/three-atmosphere@0.19.1/build/index.js",
          "@takram/three-atmosphere/shaders/bruneton": "https://cdn.jsdelivr.net/npm/@takram/three-atmosphere@0.19.1/build/shaders/bruneton.js",
          "@takram/three-geospatial": "https://cdn.jsdelivr.net/npm/@takram/three-geospatial@0.9.1/build/index.js",
          "@takram/three-geospatial/shaders": "https://cdn.jsdelivr.net/npm/@takram/three-geospatial@0.9.1/build/shaders.js",
          "@takram/three-geospatial-effects": "https://cdn.jsdelivr.net/npm/@takram/three-geospatial-effects@0.6.4/build/index.js",
          "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.1/build/index.js",
          "tiny-invariant": "https://cdn.jsdelivr.net/npm/tiny-invariant@1.3.3/dist/esm/tiny-invariant.js"
        }
      }
    </script>
  </head>
  <body>
    <h1>Sky-K.1 — Bruneton precomputed-texture bake smoke</h1>
    <p>
      Stands up a hidden <code>WebGLRenderer</code>, instantiates
      <code>AtmosphereRuntime</code>, and waits for the Bruneton
      scattering lookup tables to bake. Real GPU only — swiftshader
      silently zero-bakes 3D textures (Clouds-D-mini finding).
    </p>

    <div id="status" class="pending">pending</div>
    <pre id="details">starting…</pre>
    <canvas id="cv" width="64" height="64"></canvas>

    <script type="module">
      import * as THREE from 'three';
      import { AtmosphereRuntime } from './scene3d/atmosphere_runtime.js?v=lutbake';

      const statusEl  = document.getElementById('status');
      const detailsEl = document.getElementById('details');
      const setStatus = (cls, msg) => { statusEl.className = cls; statusEl.textContent = msg; };
      const log = (line) => { detailsEl.textContent += '\n' + line; };

      window.__atmosphereBakeSmoke = { ok: false, error: null, summary: null };

      try {
        const canvas = document.getElementById('cv');
        const renderer = new THREE.WebGLRenderer({ canvas });
        const gl = renderer.getContext();
        const ext = gl.getExtension('WEBGL_debug_renderer_info');
        const gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '(unknown)';
        log('renderer GPU: ' + gpu);
        log('three revision: ' + THREE.REVISION);

        log('constructing AtmosphereRuntime…');
        const ar = new AtmosphereRuntime({ renderer });
        window.__atmosphereBakeSmoke.runtime = ar;

        const t0 = performance.now();
        log('awaiting bake…');
        await ar.whenReady();
        const dt = (performance.now() - t0).toFixed(1);
        log('bake complete in ' + dt + 'ms (ready=' + ar.ready + ')');

        const tex = ar.textures;
        const summary = {};
        for (const k of Object.keys(tex)) {
          const t = tex[k];
          if (!t) { summary[k] = null; continue; }
          summary[k] = {
            type: t.constructor?.name ?? typeof t,
            isData3D: !!t.isData3DTexture,
            w: t.image?.width ?? null,
            h: t.image?.height ?? null,
            depth: t.image?.depth ?? null,
            format: t.format,
            pixelType: t.type,
          };
          log(`  ${k}: ${summary[k].type} ${summary[k].w}×${summary[k].h}${summary[k].depth ? '×' + summary[k].depth : ''}`);
        }
        window.__atmosphereBakeSmoke.summary = summary;
        window.__atmosphereBakeSmoke.ok = true;
        setStatus('ok', 'PASS — Bruneton textures baked');
      } catch (err) {
        window.__atmosphereBakeSmoke.ok = false;
        window.__atmosphereBakeSmoke.error = String(err);
        log('ERROR: ' + (err?.stack ?? err));
        setStatus('fail', 'FAIL — ' + (err?.message ?? err));
      }
    </script>
  </body>
</html>
