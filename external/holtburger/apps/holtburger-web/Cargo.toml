[package]
name = "holtburger-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser-loadable WASM smoke test for Phase 2 of emit-dynamic-site — verifies the wasm32 cross-compile floor by exposing a few wasm-bindgen functions over holtburger-protocol + holtburger-session."

[lib]
# `cdylib` is what `wasm-pack build` strips into the bundled `.wasm`;
# `rlib` keeps the crate available to other native consumers (none yet,
# but cheap insurance and required so workspace `cargo check` is sane).
crate-type = ["cdylib", "rlib"]

[dependencies]
holtburger-common = { workspace = true }
holtburger-protocol = { workspace = true }
holtburger-session = { workspace = true }
wasm-bindgen = "0.2"
# Phase 4 step 3.6 — wasm-friendly Instant. Already used by
# holtburger-session (Session::last_send_time / last_recv_time) and the
# cli's runtime keepalive comparisons; the web bundle adopts it as part
# of wiring the cli's MovementSystem into the recv loop. Native target
# transparently re-exports `std::time::Instant`.
web-time = { workspace = true }

# Wasm32-only deps:
# - `console_error_panic_hook`: surfaces Rust panics in the browser
#   console instead of the default `unreachable` trap.
# - `holtburger-transport-ws`: the §8-step-2 WS transport. Its body is
#   itself wasm32-gated, so the dep is too — keeping it out of native
#   graphs avoids dragging `web-sys` along.
# - `wasm-bindgen-futures`: lets us return a JS Promise from an `async
#   fn` `wasm_bindgen` export so the smoke test can `await` it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow = { workspace = true }
console_error_panic_hook = "0.1"
# `futures` for the Phase 4 step 2a recv loop — `mpsc::unbounded`
# command channel + `oneshot` for the initial-CharacterList signal,
# `StreamExt`/`SinkExt` extension traits.
futures = { workspace = true }
# Phase 4 step 2a.5 — character creation in the browser:
# `holtburger-content::CharacterGenCatalog` cross-references CharGen
# (0x0E000002) + SkillTable; `holtburger-core::CharacterGenBuilder`
# validates a `CharacterGenBuild` against heritage / template /
# attribute-budget / skill-budget rules and produces the wire-shaped
# `CharacterCreateRequestData`. Both crates already cross-compile to
# wasm32 (Phase 2 floor).
holtburger-content = { workspace = true }
holtburger-core = { workspace = true }
holtburger-dat = { workspace = true }
# Phase 4 step 3.6 — `WorldBootstrap` + `WorldState` constructed in
# the recv loop on EnteredWorld. Drives the cli's `MovementSystem` shim
# (MovementSystemHandle) for the AutonomousPosition heartbeat fix.
holtburger-world = { workspace = true }
holtburger-resource-http = { workspace = true }
holtburger-transport-ws = { workspace = true }
# `log` so the recv loop can route session-side log lines to
# `console.log` via the wasm-bindgen log glue (no panic-spam from
# unwrapped errors).
log = { workspace = true }
# `tokio` macros (`select!`) for the recv loop's race between
# `session.recv_message().await` and the JS-driven command channel.
# `sync` (oneshot) is used by the initial-CharacterList handoff
# from the recv loop back to the awaiting `start_session` future.
tokio = { workspace = true, features = ["macros", "sync"] }
wasm-bindgen-futures = "0.4"

# Phase 4 step 6 Phase A native tests for triangulate_setup_model_with_substitutions:
# the substituting triangulator helpers are gated cfg(any(target_arch = "wasm32",
# test)) so we can drive them natively against a MockSource. holtburger-dat is
# otherwise wasm32-only above (the static-placement / live-render path doesn't
# need it native), so we pull it in just for `cargo test`.
[dev-dependencies]
holtburger-dat = { workspace = true }
holtburger-common = { workspace = true }
