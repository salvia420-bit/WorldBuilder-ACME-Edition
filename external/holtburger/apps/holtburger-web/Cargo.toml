[package]
name = "holtburger-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser-loadable WASM smoke test for Phase 2 of emit-dynamic-site — verifies the wasm32 cross-compile floor by exposing a few wasm-bindgen functions over holtburger-protocol + holtburger-session."

[lib]
# `cdylib` is what `wasm-pack build` strips into the bundled `.wasm`;
# `rlib` keeps the crate available to other native consumers (none yet,
# but cheap insurance and required so workspace `cargo check` is sane).
crate-type = ["cdylib", "rlib"]

[dependencies]
holtburger-common = { workspace = true }
holtburger-protocol = { workspace = true }
holtburger-session = { workspace = true }
wasm-bindgen = "0.2"
# Phase 1.5 — surface override JSON parsing. Lives in [dependencies]
# (not [target.cfg(wasm32)]) because `surface_overrides` is built on
# both wasm32 and native test paths (cfg(any(target_arch="wasm32", test))),
# mirroring `fetch_surface_pixels_impl`.
serde = { workspace = true }
serde_json = { workspace = true }
# Wave F.1 (2026-05-27) — `serde_wasm_bindgen::to_value(&serde_json::Value)`
# converts a built `serde_json!()` literal into a structured JS object
# for `SessionHandle::getSpellRecord` + `getSpellComponentRecord`. The
# alternative (manual `js_sys::Object` construction or `JSON.parse(json_str)`
# at the JS callsite) is uglier and slower; this crate is a thin wrapper
# around `wasm_bindgen` so the wasm-bundle weight cost is negligible.
serde-wasm-bindgen = "0.6"
# Phase 4 step 3.6 — wasm-friendly Instant. Already used by
# holtburger-session (Session::last_send_time / last_recv_time) and the
# cli's runtime keepalive comparisons; the web bundle adopts it as part
# of wiring the cli's MovementSystem into the recv loop. Native target
# transparently re-exports `std::time::Instant`.
web-time = { workspace = true }

# Wasm32-only deps:
# - `console_error_panic_hook`: surfaces Rust panics in the browser
#   console instead of the default `unreachable` trap.
# - `holtburger-transport-ws`: the §8-step-2 WS transport. Its body is
#   itself wasm32-gated, so the dep is too — keeping it out of native
#   graphs avoids dragging `web-sys` along.
# - `wasm-bindgen-futures`: lets us return a JS Promise from an `async
#   fn` `wasm_bindgen` export so the smoke test can `await` it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow = { workspace = true }
console_error_panic_hook = "0.1"
# `futures` for the Phase 4 step 2a recv loop — `mpsc::unbounded`
# command channel + `oneshot` for the initial-CharacterList signal,
# `StreamExt`/`SinkExt` extension traits.
futures = { workspace = true }
# Phase 4 step 2a.5 — character creation in the browser:
# `holtburger-content::CharacterGenCatalog` cross-references CharGen
# (0x0E000002) + SkillTable; `holtburger-core::CharacterGenBuilder`
# validates a `CharacterGenBuild` against heritage / template /
# attribute-budget / skill-budget rules and produces the wire-shaped
# `CharacterCreateRequestData`. Both crates already cross-compile to
# wasm32 (Phase 2 floor).
holtburger-content = { workspace = true }
holtburger-core = { workspace = true }
holtburger-dat = { workspace = true }
# Phase 5.2 obj 8 — `manifest_v2_version_const` wasm-bindgen export
# surfaces `holtburger_manifest::v2::MANIFEST_V2_VERSION` to the
# Node smoke harness so it can verify the v2 schema constant
# without re-vendoring.
holtburger-manifest = { workspace = true }
# Phase 4 step 3.6 — `WorldBootstrap` + `WorldState` constructed in
# the recv loop on EnteredWorld. Drives the cli's `MovementSystem` shim
# (MovementSystemHandle) for the AutonomousPosition heartbeat fix.
# Phase 6 step E — `test-support` exposes `WorldBootstrap::synthetic()`
# so the wasm-side `holtburg_test_door_state_event_emitted` smoke can
# stand up a live `WorldState` without any DAT files.
holtburger-world = { workspace = true, features = ["test-support"] }
holtburger-resource-http = { workspace = true }
holtburger-transport-ws = { workspace = true }
# `log` so the recv loop can route session-side log lines to
# `console.log` via the wasm-bindgen log glue (no panic-spam from
# unwrapped errors).
log = { workspace = true }
# `tokio` macros (`select!`) for the recv loop's race between
# `session.recv_message().await` and the JS-driven command channel.
# `sync` (oneshot) is used by the initial-CharacterList handoff
# from the recv loop back to the awaiting `start_session` future.
tokio = { workspace = true, features = ["macros", "sync"] }
wasm-bindgen-futures = "0.4"
# Wave 3 prereq (2026-05-19) — `gloo-timers` provides a setTimeout-backed
# Future so the recv loop can race an InWorld 5s keepalive arm against
# `session.recv_message()` + the JS cmd channel. Mirrors the cli's
# `crates/holtburger-core/src/client/runtime.rs::should_send_keepalive_ping`
# arm. `tokio::time::sleep` panics on wasm32 ("time not implemented")
# so this is the canonical wasm-side timer.
gloo-timers = { version = "0.3", features = ["futures"] }
# Transport-in-worker port (net_worker.rs): `js_sys::{Function, Uint8Array}`
# for the wasm↔JS postMessage sinks that bridge the main-thread
# `RemoteSessionProxy` and the net_worker's own wasm instance. Kept in the
# wasm32-only block — like the rest of the recv-loop deps, it never enters
# the native graph.
js-sys = "0.3"
# `async-trait` to implement `holtburger_session::ActionSink` for
# `LoopSession` (the recv loop's pluggable session) — the movement
# integrator takes `&mut dyn ActionSink`, so `LoopSession` must impl it.
async-trait = { workspace = true }

# Phase 4 step 6 Phase A native tests for triangulate_setup_model_with_substitutions:
# the substituting triangulator helpers are gated cfg(any(target_arch = "wasm32",
# test)) so we can drive them natively against a MockSource. holtburger-dat is
# otherwise wasm32-only above (the static-placement / live-render path doesn't
# need it native), so we pull it in just for `cargo test`.
[dev-dependencies]
holtburger-dat = { workspace = true }
holtburger-common = { workspace = true }
# A15 S2 (2026-07-24) — `get_file_shared_forwards_through_every_wrapper`
# asserts Arc pointer identity through the WHOLE wrapper stack in one test,
# and `RecordingSource` is one of the four wrappers. The wasm32 dep block
# above already pulls this crate for the live build; this is the native-test
# mirror (the crate builds for the host — its own `cargo test` does).
holtburger-resource-http = { workspace = true }
# Wave C.2 (2026-05-27) — native tests for `compute_{vital,skill}_*_impl`
# need `holtburger_core::client::{attribute_info, vital_info, skill_info,
# skill_formula, character_info}` available natively. The helpers are
# `cfg(any(target_arch="wasm32", test))`-gated so the canonical math layer
# can be exercised via `cargo test -p holtburger-web --lib` without
# requiring a wasm runtime. The wasm32 dep block above already pulls
# holtburger-core for the live recv-loop build.
holtburger-core = { workspace = true }
# F.37 (2026-05-14) — native tests for `walk_dedup::WalkDedupMapT`
# need a tokio runtime + the `futures` join_all combinator. The
# wasm32 build already pulls these via the cfg(wasm32)
# `[target.cfg(wasm32)].dependencies` block above; dev-dependencies
# is the native-test mirror. `time` enables `tokio::time::sleep`
# for the overlap-window proof; `rt-multi-thread` is required for
# `#[tokio::test]`'s default runtime, though our tests are
# single-task by design (RefCell-backed dedup map is `!Send`).
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
futures = { workspace = true }
