<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>cloud_build_smoke — Clouds-B local build parity</title>
    <style>
      body { font-family: ui-monospace, monospace; margin: 2rem; line-height: 1.4; }
      #status { padding: 0.5rem 0.75rem; border-radius: 4px; font-weight: bold; }
      #status.pending { background: #f4f4f4; color: #888; }
      #status.ok      { background: #e7f5e7; color: #1a7f1a; }
      #status.fail    { background: #fae8e8; color: #b30000; }
      pre { background: #f7f7f7; padding: 0.5rem; border-radius: 4px; font-size: 0.85rem; }
    </style>

    <!-- Importmap mirrors index.html EXCEPT @takram/three-clouds is
         redirected to the local vendor build/. Verifies that the
         locally-built bundle is functionally interchangeable with the
         npm-published CDN bundle. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "@takram/three-clouds": "./vendor/takram-three-clouds/build/index.js",
          "@takram/three-atmosphere": "https://cdn.jsdelivr.net/npm/@takram/three-atmosphere@0.19.1/build/index.js",
          "@takram/three-atmosphere/shaders/bruneton": "https://cdn.jsdelivr.net/npm/@takram/three-atmosphere@0.19.1/build/shaders/bruneton.js",
          "@takram/three-geospatial": "https://cdn.jsdelivr.net/npm/@takram/three-geospatial@0.9.1/build/index.js",
          "@takram/three-geospatial/shaders": "https://cdn.jsdelivr.net/npm/@takram/three-geospatial@0.9.1/build/shaders.js",
          "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.1/build/index.js",
          "tiny-invariant": "https://cdn.jsdelivr.net/npm/tiny-invariant@1.3.3/dist/esm/tiny-invariant.js"
        }
      }
    </script>
  </head>
  <body>
    <h1>Clouds-B — local-build module load</h1>
    <div id="status" class="pending">pending</div>
    <pre id="details">starting…</pre>

    <script type="module">
      const statusEl  = document.getElementById('status');
      const detailsEl = document.getElementById('details');
      const setStatus = (cls, msg) => { statusEl.className = cls; statusEl.textContent = msg; };
      const appendDetail = (line) => { detailsEl.textContent += '\n' + line; };

      window.__cloudLoadSmoke = { ok: false, error: null, names: [] };
      try {
        const Clouds = await import('@takram/three-clouds');
        const names = Object.keys(Clouds).sort();
        appendDetail(`@takram/three-clouds (local build): ${names.length} exports`);
        appendDetail(`named: ${names.join(', ')}`);

        const required = ['CloudsEffect', 'CloudLayer', 'CloudLayers'];
        const missing = required.filter(n => !(n in Clouds));
        if (missing.length) throw new Error('missing required exports: ' + missing.join(', '));

        // Compare against the CDN bundle's surface so we catch drift.
        const expectedSet = new Set([
          'CLOUD_SHAPE_DETAIL_TEXTURE_SIZE','CLOUD_SHAPE_TEXTURE_SIZE','CloudLayer','CloudLayers',
          'CloudShape','CloudShapeDetail','CloudsEffect','DEFAULT_LOCAL_WEATHER_URL',
          'DEFAULT_SHAPE_DETAIL_URL','DEFAULT_SHAPE_URL','DEFAULT_TURBULENCE_URL','DensityProfile',
          'LocalWeather','Procedural3DTextureBase','ProceduralTextureBase','Turbulence',
          'cloudsPassOptionsDefaults',
        ]);
        const surfaceMatch = names.length === expectedSet.size && names.every(n => expectedSet.has(n));

        window.__cloudLoadSmoke = { ok: true, error: null, names, surfaceMatch };
        setStatus('ok', surfaceMatch
          ? 'OK — local build surface matches CDN'
          : 'OK (partial) — module loads but export surface diverges from CDN');
        appendDetail('OK');
      } catch (err) {
        window.__cloudLoadSmoke = { ok: false, error: String(err), names: [] };
        setStatus('fail', 'FAIL — ' + err.message);
        appendDetail('FAIL: ' + (err.stack ?? err));
      }
    </script>
  </body>
</html>
